[package]
name = "redox-daemon"
authors = ["4lDO2 <4lDO2@protonmail.com>"]
version = "0.1.0"
edition = "2021"
license = "MIT"
exclude = ["target"]
description = "Tiny daemon library for Redox"
repository = "https://gitlab.redox-os.org/redox-os/redox-daemon"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
scheme = ["bytemuck"]

[dependencies]
libc = "0.2"
#redox_syscall = "0.3"
redox_syscall = { git = "https://gitlab.redox-os.org/4lDO2/syscall", branch = "better_packet_format" }
bytemuck = { version = "1", optional = true }
